version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: portfolio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    networks:
      - portfolio-network

  backend:
    build: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=${MONGODB_URI:?set MONGODB_URI in .env}
      - RESEND_API_KEY=${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      - EMAIL_FROM=${EMAIL_FROM:?set EMAIL_FROM in .env}
      - EMAIL_USER=${EMAIL_USER:?set EMAIL_USER in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - portfolio-network
    env_file:
      - ./backend/.env

volumes:
  mongodb_data:

networks:
  portfolio-network:
    driver: bridge
